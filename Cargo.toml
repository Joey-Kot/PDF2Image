[package]
name = "pdf2image"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A cross-platform CLI that renders PDF pages to WebP, PNG, or JPEG images."

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hayro = "0.7.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
webp = { version = "0.3.1", default-features = false }

[dev-dependencies]
image = { version = "0.25.8", default-features = false, features = ["webp"] }
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
